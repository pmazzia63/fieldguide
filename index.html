<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020618" />
    <title>FieldGuide · Les postes du basket, du football américain et du baseball</title>
    <meta
      name="description"
      content="Explorez en 3D les postes du basket, du football américain et du baseball : rôle de chaque joueur sur le terrain, placement en attaque et en défense, joueurs célèbres."
    />
    <style>
      /* Avant le chargement de React : écran de chargement par-dessus la liste statique des postes. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #020618;
        color: #cad5e2;
        font: 0.875rem/1.25rem system-ui, sans-serif;
      }
      #boot-loader span {
        width: 2.5rem;
        height: 2.5rem;
        box-sizing: border-box;
        border: 4px solid #314158;
        border-top-color: #ffb900;
        border-radius: 50%;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader span {
          animation: none;
        }
      }
      #static-positions {
        max-width: 48rem;
        margin: 0 auto;
        padding: 1.5rem 1rem;
        font: 1rem/1.5 system-ui, sans-serif;
      }
      #static-positions a {
        color: #b8e6fe;
      }
    </style>
    <noscript><style>#boot-loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status"><span aria-hidden="true"></span>Chargement de FieldGuide…</div>
      <!--static-positions-->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
